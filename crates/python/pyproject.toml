[project]
name = "potatodb-python"
version = "0.1.0"
description = "Python bindings for PotatoDB"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
