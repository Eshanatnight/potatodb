name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  build:
    name: Build and upload assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Package binary and FFI libs (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ZIP=potatodb-${{ matrix.name }}.zip
          rm -f "$ZIP"
          # Collect main binary and any ffi artifacts produced by the ffi crate
          FILES=(target/release/potatodb target/release/libpotatodb_ffi.* target/release/libpotatodb_ffi.a)
          for f in "${FILES[@]}"; do
            for match in $f; do
              if [ -e "$match" ]; then
                zip -j "$ZIP" "$match"
              fi
            done
          done

      - name: Package binary and FFI libs (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = "potatodb-${{ matrix.name }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          $items = @()
          if (Test-Path target\release\potatodb.exe) { $items += "target\release\potatodb.exe" }
          if (Test-Path target\release\potatodb_ffi.dll) { $items += "target\release\potatodb_ffi.dll" }
          if (Test-Path target\release\potatodb_ffi.lib) { $items += "target\release\potatodb_ffi.lib" }
          if ($items.Count -eq 0) { New-Item -Path $zip -ItemType File | Out-Null } else { Compress-Archive -Path $items -DestinationPath $zip -Force }

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./potatodb-${{ matrix.name }}.zip
          asset_name: potatodb-${{ matrix.name }}.zip
          asset_content_type: application/zip
